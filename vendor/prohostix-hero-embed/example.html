<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prohostix hero embed example</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif}
  .navbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:10;display:flex;align-items:center;padding:0 24px;background:rgba(0,0,0,.6)}
  /* ---- HERO: paste from here ---- */
  .px-hero{position:relative;height:500vh;background:#000}   /* scroll length = animation length */
  .px-sticky{position:sticky;top:0;height:100vh;width:100%;overflow:hidden}
  .px-sticky canvas{display:block;width:100%;height:100%}
  #px-loader{position:absolute;inset:0;z-index:5;background:#000;display:grid;place-items:center;transition:opacity .6s}
  #px-loader svg{width:21vw;max-width:60vh;animation:pxp 1.6s ease-in-out infinite}
  @keyframes pxp{50%{opacity:.7}}
  /* ---- to here ---- */
  .after{min-height:100vh;display:grid;place-items:center;font-size:32px}
</style></head><body>
<div class="navbar">YOUR NAVBAR</div>

<section class="px-hero" data-px-hero>
  <div class="px-sticky">
    <div id="px-loader"><svg viewBox="178 198 700 704" aria-label="Prohostix"><rect x="292" y="513" width="472" height="72" fill="#fff"/><g fill="#169B68"><circle cx="528" cy="312" r="114"/><circle cx="528" cy="788" r="114"/><circle cx="292" cy="551" r="114"/><circle cx="764" cy="551" r="114"/></g></svg></div>
    <canvas id="c"></canvas>
  </div>
</section>
<script src="prohostix-hero.js" defer></script>

<section class="after">Next section of your website</section>
</body></html>
